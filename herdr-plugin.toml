id = "prompt-history"
name = "prompt-history"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Browse the prompts of a Claude Code session and re-read the report for each one; Enter opens it in nvim."
platforms = ["macos", "linux"]

# Bind this to a key. It finds the Claude session in the focused pane and
# opens the viewer below for it, via `herdr plugin pane open`.
[[actions]]
id = "open"
title = "prompt history: open"
contexts = ["pane"]
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" open"]

# The same viewer in a tab of its own, to switch to and back while Claude
# keeps the main tab. Pressing it again returns to the tab already open for
# that session.
[[actions]]
id = "open-tab"
title = "prompt history: open in a tab"
contexts = ["pane"]
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" open-tab"]

# The viewer: prompt list on the left, the selected prompt's report on the
# right. The session comes in PH_SESSION_ID, set by the open actions, which
# also choose the placement (popup or tab).
[[panes]]
id = "viewer"
title = "prompt history"
placement = "popup"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" view"]

[[build]]
command = ["bash", "herdr/install.sh"]
